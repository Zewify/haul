name: Komizo
options:
  bundleIdPrefix: com.zewify
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  KomizoCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.2"
    CURRENT_PROJECT_VERSION: "7"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      # Releases run on Apple Silicon and Intel alike.
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO
targets:
  Komizo:
    type: application
    platform: macOS
    configFiles:
      Debug: App/Signing.xcconfig
      Release: App/Signing.xcconfig
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: KomizoCore
      - target: KomizoSafari
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Komizo
        CFBundleDisplayName: Komizo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © 2026 Zewify
        # Plain http downloads are the job; ATS would refuse them.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: App/Komizo.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zewify.komizo
        PRODUCT_NAME: Komizo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO

  # The Safari Web Extension: the shared extension files, packaged inside the app.
  KomizoSafari:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: App/Signing.xcconfig
      Release: App/Signing.xcconfig
    sources:
      - path: SafariExtension/SafariWebExtensionHandler.swift
      - path: Extension/manifest.json
        buildPhase: resources
      - path: Extension/background.js
        buildPhase: resources
      - path: Extension/content.js
        buildPhase: resources
      - path: Extension/popup.html
        buildPhase: resources
      - path: Extension/popup.js
        buildPhase: resources
      - path: Extension/options.html
        buildPhase: resources
      - path: Extension/options.js
        buildPhase: resources
      - path: Extension/icons
        type: folder
        buildPhase: resources
    # lib is copied by a script, so a new file is never missed, but without its node tests, which are not part of
    # the extension. Xcode's script sandbox only lets a script read files declared one by one, which would miss new
    # ones, so it is off for this target alone (in its settings below); the script is the repo's own and fails the
    # build on any error.
    postBuildScripts:
      - name: Copy the extension's lib without its tests
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          rm -rf "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/lib"
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/lib"
          for file in "$SRCROOT"/Extension/lib/*.js; do
            case "$file" in *.test.js) continue ;; esac
            cp "$file" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/lib/"
          done
          [ -f "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/lib/media.js" ]
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleName: Komizo
        CFBundleDisplayName: Komizo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: © 2026 Zewify
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: SafariExtension/KomizoSafari.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zewify.komizo.safari
        PRODUCT_NAME: KomizoSafari
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  KomizoTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: App/Signing.xcconfig
      Release: App/Signing.xcconfig
    sources:
      - path: AppTests
      # The core's loopback test server, so app tests can serve real playlists and files.
      - path: Core/Tests/KomizoCoreTests/TestServer.swift
    dependencies:
      - target: Komizo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zewify.komizo.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Komizo.app/Contents/MacOS/Komizo
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Komizo:
    build:
      targets:
        Komizo: all
        KomizoTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KomizoTests
    archive:
      config: Release
