name: Haul
options:
  bundleIdPrefix: com.zewify
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
  # The direct edition, sold from zewify.com: the same app with the video grabber compiled in.
  Debug-Direct: debug
  Release-Direct: release
packages:
  HaulCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug-Direct:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG DIRECT_EDITION
    Release-Direct:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DIRECT_EDITION
targets:
  Haul:
    type: application
    platform: macOS
    configFiles:
      Debug: App/Signing.xcconfig
      Release: App/Signing.xcconfig
      Debug-Direct: App/Signing.xcconfig
      Release-Direct: App/Signing.xcconfig
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: HaulCore
      - target: HaulSafari
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Haul
        CFBundleDisplayName: Haul
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © 2026 Zewify
        # Plain http downloads are the job; ATS would refuse them.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: App/Haul.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zewify.haul
        PRODUCT_NAME: Haul
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO

  # The Safari Web Extension: the shared extension files, packaged inside the app.
  HaulSafari:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: App/Signing.xcconfig
      Release: App/Signing.xcconfig
      Debug-Direct: App/Signing.xcconfig
      Release-Direct: App/Signing.xcconfig
    sources:
      - path: SafariExtension/SafariWebExtensionHandler.swift
      - path: Extension/manifest.json
        buildPhase: resources
      - path: Extension/background.js
        buildPhase: resources
      - path: Extension/content.js
        buildPhase: resources
      - path: Extension/popup.html
        buildPhase: resources
      - path: Extension/popup.js
        buildPhase: resources
      - path: Extension/options.html
        buildPhase: resources
      - path: Extension/options.js
        buildPhase: resources
      - path: Extension/lib
        type: folder
        buildPhase: resources
      - path: Extension/icons
        type: folder
        buildPhase: resources
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleName: Haul
        CFBundleDisplayName: Haul
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: © 2026 Zewify
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: SafariExtension/HaulSafari.entitlements
      properties:
        com.apple.security.app-sandbox: true
    postBuildScripts:
      - name: Strip media grabbing from the store edition
        script: ./scripts/strip-media.sh
        shell: /bin/bash
        inputFiles: ["$(SRCROOT)/scripts/strip-media.sh", "$(SRCROOT)/Extension/manifest.json", "$(SRCROOT)/Extension/lib/media.js"]
        outputFiles: ["$(DERIVED_FILE_DIR)/strip-media.stamp"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zewify.haul.safari
        PRODUCT_NAME: HaulSafari
        ENABLE_HARDENED_RUNTIME: YES
        # The strip script rewrites the copied extension, which the script sandbox would refuse.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  HaulTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: App/Signing.xcconfig
      Release: App/Signing.xcconfig
      Debug-Direct: App/Signing.xcconfig
      Release-Direct: App/Signing.xcconfig
    sources:
      - path: AppTests
    dependencies:
      - target: Haul
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zewify.haul.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Haul.app/Contents/MacOS/Haul
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Haul:
    build:
      targets:
        Haul: all
        HaulTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HaulTests
    archive:
      config: Release
  Haul-Direct:
    build:
      targets:
        Haul: all
        HaulTests: [test]
    run:
      config: Debug-Direct
    test:
      config: Debug-Direct
      targets:
        - HaulTests
    archive:
      config: Release-Direct
