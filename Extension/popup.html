<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; font: 13px -apple-system, system-ui, sans-serif; }
    body { margin: 0; width: 300px; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #8e8e93; }
    .dot.on { background: #34c759; }
    .dot.warn { background: #ff9f0a; }
    p { margin: 6px 0; color: color-mix(in srgb, currentColor 65%, transparent); }
    button { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid color-mix(in srgb, currentColor 25%, transparent); background: color-mix(in srgb, currentColor 6%, transparent); cursor: pointer; }
    button.primary { background: #1098f4; color: white; border-color: #1098f4; }
    label { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
    ul { list-style: none; padding: 0; margin: 8px 0 0; max-height: 240px; overflow: auto; }
    li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
    li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .error { color: #ff453a; }
    .muted { color: color-mix(in srgb, currentColor 55%, transparent); font-size: 12px; }
  </style>
</head>
<body>
  <h1><span class="dot" id="dot"></span> Haul <span class="muted" id="state"></span></h1>
  <div id="connect" hidden>
    <p id="connectHint">Press Connect, then allow this browser in the Haul window.</p>
    <button class="primary" id="pairButton">Connect to Haul</button>
    <p class="error" id="pairError" hidden></p>
  </div>
  <div id="down" hidden>
    <p>Haul is not running. Open it to hand downloads over; until then your browser downloads as usual.</p>
    <p class="muted" id="portHint"></p>
  </div>
  <div id="ready" hidden>
    <label><input type="checkbox" id="capture"> Catch downloads</label>
    <div id="mediaSection" hidden>
      <p class="muted">Media found on this page</p>
      <ul id="media"></ul>
      <p class="muted" id="noMedia">Nothing yet. Play a video and look again.</p>
    </div>
    <p class="muted"><a href="#" id="options">Options</a> · <a href="#" id="disconnect">Disconnect</a></p>
  </div>
  <script src="lib/media.js"></script>
  <script src="popup.js"></script>
</body>
</html>
