<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; font: 13px -apple-system, system-ui, sans-serif; }
    body { margin: 0; padding: 16px; width: 320px; }
    label { display: block; margin-bottom: 6px; }
    input { font: inherit; width: 90px; }
    button { font: inherit; margin-left: 6px; }
    p { color: color-mix(in srgb, currentColor 60%, transparent); }
  </style>
</head>
<body>
  <label for="port">Haul app port</label>
  <input id="port" type="number" min="1" max="65535"> <button id="save">Save</button>
  <p>Only change this if you changed the port in Haul → Settings → Connections. The default is 48512.</p>
  <p id="result"></p>
  <script src="options.js"></script>
</body>
</html>
